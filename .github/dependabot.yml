version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 10
    groups:
      patch-dependencies:
        applies-to: version-updates
        update-types:
          - 'patch'
      major-dependencies:
        applies-to: version-updates
        update-types:
          - 'major'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-minor']
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps)'
    versioning-strategy: increase

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/New_York'
    labels:
      - 'dependencies'
      - 'ci'
    commit-message:
      prefix: 'chore(ci)'
