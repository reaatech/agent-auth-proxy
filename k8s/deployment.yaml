apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-auth-proxy
  labels:
    app: agent-auth-proxy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agent-auth-proxy
  template:
    metadata:
      labels:
        app: agent-auth-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: agent-auth-proxy
          image: ghcr.io/reaatech/agent-auth-proxy:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: url
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: encryption-secret
                  key: master-key
            - name: AGENT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: encryption-secret
                  key: agent-jwt-secret
            - name: AGENT_JWT_EXPIRY
              value: "3600"
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: admin-secret
                  key: admin-api-key
            - name: OAUTH_REDIRECT_URI
              value: "https://proxy.example.com/oauth/callback"
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth-secret
                  key: google-client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth-secret
                  key: google-client-secret
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth-secret
                  key: github-client-id
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth-secret
                  key: github-client-secret
            - name: RATE_LIMIT_GLOBAL_MAX
              value: "1000"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
